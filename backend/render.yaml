services:
  - type: web
    name: academic-workload-optimizer-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./academic_planner.db
      - key: LLM_API_KEY
        sync: false
