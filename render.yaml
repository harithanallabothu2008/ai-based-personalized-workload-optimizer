services:
  - type: web
    name: academic-workload-optimizer-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./backend/academic_planner.db
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_API_KEY
        sync: false
